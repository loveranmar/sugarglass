# NAAT Glass: Hyprland window rule for Discord
#
# Keeps Discord at full opacity whether it's focused or not, so only the theme
# decides how see-through it is. Hyprland's normal blur then frosts whatever
# is behind the window.
#
# Don't use `opaque = true` for Discord: it throws away the window's
# transparency and the background turns black.
#
# Block syntax, tested on Hyprland 0.55. Using Vesktop? Change the class to vesktop.
windowrule {
    name = discord-naat-glass
    match:class = ^(discord)$
    opacity = 1.0 override 1.0 override
}
